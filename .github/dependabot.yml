version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "30 0 1 * *"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 50
    assignees:
      - "ammnt"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "30 0 1 * *"
      timezone: "UTC"
    target-branch: "main"
    assignees:
      - "ammnt"
